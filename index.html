<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHYA' 7 TV - TELEVISI AHLUSSUNAH WAL JAMA'AH</title>
    
    <link rel="icon" type="image/png" href="logoihya7tv.png">

    <!-- Google Fonts & Boxicons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0284c7;
            --primary-light: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 20px 40px -15px rgba(2, 132, 199, 0.15), 0 0 20px rgba(255, 255, 255, 0.5) inset;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
        }

        body {
            background: #f0f6ff;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* AMBIENT 3D BACKGROUND GLOWS */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            pointer-events: none;
            opacity: 0.7;
            animation: floatGlow 10s infinite alternate ease-in-out;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56,189,248,0.4) 0%, rgba(2,132,199,0.1) 70%);
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(14,165,233,0.3) 0%, rgba(99,102,241,0.15) 70%);
            bottom: 10%;
            right: -150px;
            animation-delay: -5s;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* HEADER NAVBAR (GLASSMORPHISM) */
        .navbar {
            position: sticky;
            top: 15px;
            z-index: 100;
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .nav-container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
            transition: transform 0.3s ease;
        }

        .brand:hover img {
            transform: scale(1.08) rotate(3deg);
        }

        .brand h1 {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(2, 132, 199, 0.15);
        }

        .menu-toggle {
            background: linear-gradient(135deg, #ffffff 0%, #e0f2fe 100%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: var(--primary);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1), inset 0 1px 1px rgba(255,255,255,0.8);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .menu-toggle:hover {
            transform: translateY(-2px) scale(1.05);
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .menu-toggle:active {
            transform: translateY(1px) scale(0.98);
        }

        /* SIDEBAR STYLES (3D GLASS) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 15px 0 35px rgba(2, 132, 199, 0.15);
            z-index: 1000;
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar.open {
            left: 0 !important;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .sidebar-logo {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .close-btn {
            font-size: 28px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 8px;
        }

        .close-btn:hover {
            color: var(--primary);
            transform: rotate(90deg);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-links li a {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .nav-links li a:hover,
        .nav-links li a.active {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(224, 242, 254, 0.6) 100%);
            border-color: rgba(56, 189, 248, 0.4);
            color: var(--primary);
            box-shadow: 0 8px 16px rgba(2, 132, 199, 0.08);
            transform: translateX(5px);
        }

        .nav-links li.disabled a {
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .nav-links li.disabled a:hover {
            transform: none;
            background: transparent;
            border-color: transparent;
            box-shadow: none;
        }

        .lock-icon {
            margin-left: auto;
            font-size: 14px;
        }

        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            padding-top: 20px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* MAIN LAYOUT */
        .main-content {
            max-width: 1050px;
            margin: 0 auto;
            padding: 30px 16px;
        }

        .section-container {
            margin-bottom: 45px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 800;
            color: #0284c7;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 18px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.05);
        }

        /* THUMBNAIL SLIDER 3D GLASS */
        .slider-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 24px;
            position: relative;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(2, 132, 199, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.5);
        }

        .slider-track {
            display: flex;
            width: 300%;
            height: 100%;
            animation: autoSlide2s5 7.5s infinite ease-in-out;
        }

        .slide-item {
            width: 33.333%;
            height: 100%;
            position: relative;
            flex-shrink: 0;
        }

        .slide-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.85), transparent);
            backdrop-filter: blur(4px);
        }

        .slide-caption span {
            background: linear-gradient(135deg, #0284c7 0%, #0284c7 100%);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 8px 18px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes autoSlide2s5 {
            0%, 28%   { transform: translateX(0%); }
            33%, 61%  { transform: translateX(-33.333%); }
            66%, 94%  { transform: translateX(-66.666%); }
            100%      { transform: translateX(0%); }
        }

        /* PROFILE CARD (GLASSMORPHISM 3D) */
        .profile-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 45px;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.7s ease;
        }

        .profile-card:hover::before {
            left: 100%;
        }

        .profile-card:hover {
            transform: translateY(-3px);
        }

        .profile-card p {
            font-size: 13.5px;
            line-height: 1.8;
            color: #334155;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .profile-card strong {
            color: #0284c7;
            font-weight: 800;
        }

        .est-badge {
            display: inline-block;
            margin-top: 14px;
            font-weight: 800;
            color: #0284c7;
            font-size: 11px;
            background: rgba(2, 132, 199, 0.08);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(2, 132, 199, 0.15);
            letter-spacing: 1px;
        }

        /* LIVE BADGE & VIDEO CONTAINER */
        .badge-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 24px;
        }

        .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.3), transparent);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.12);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #0284c7;
            border-radius: 50%;
            box-shadow: 0 0 12px #0284c7;
            animation: pulse3d 1.5s infinite ease-in-out;
        }

        @keyframes pulse3d {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(2, 132, 199, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
        }

        .live-text {
            font-size: 12px;
            font-weight: 800;
            color: #0284c7;
            letter-spacing: 2px;
        }

        .responsive-iframe {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 24px;
            background: #000;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(2, 132, 199, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .responsive-iframe iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* ARCHIVE VIDEO GRID (3D CARDS) */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        @media (min-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .video-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 30px rgba(2, 132, 199, 0.18);
            border-color: rgba(56, 189, 248, 0.6);
        }

        .video-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
        }

        .video-card h3 {
            font-size: 11px;
            font-weight: 700;
            padding: 12px;
            color: #334155;
            text-transform: uppercase;
            font-style: italic;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* FOOTER GLASS */
        footer {
            text-align: center;
            padding: 40px 20px 25px;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .social-links a {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0284c7;
            font-size: 22px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .social-links a:hover {
            background: #0284c7;
            color: #ffffff;
            transform: translateY(-4px) scale(1.1);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .copyright {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <!-- AMBIENT BACKGROUND GLOWS -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- OVERLAY LAYAR -->
    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR NAVIGATION -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-logo">MENU</h2>
            <i class='bx bx-x close-btn' id="close-btn"></i>
        </div>
        
        <ul class="nav-links">
            <li>
                <a href="#" class="active">
                    <i class='bx bx-home-alt'></i>
                    <span class="link-name">BERANDA</span>
                </a>
            </li>
            <li>
                <a href="/control">
                    <i class='bx bx-slider-alt'></i>
                    <span class="link-name">CONTROL PANEL</span>
                </a>
            </li>
            <li class="disabled">
                <a href="#">
                    <i class='bx bx-tv'></i>
                    <span class="link-name">PROGRAM TV</span>
                    <i class='bx bx-lock-alt lock-icon'></i>
                </a>
            </li>
            <li class="disabled">
                <a href="#">
                    <i class='bx bx-calendar'></i>
                    <span class="link-name">JADWAL</span>
                    <i class='bx bx-lock-alt lock-icon'></i>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <p>Fitur Coming Soon</p>
        </div>
    </aside>

    <!-- HEADER NAVBAR -->
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <img src="logoihya7tv.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/717/717426.png'">
                <h1>IHYA' 7 TV</h1>
            </div>
            <button class="menu-toggle" id="menu-toggle">
                <i class='bx bx-menu'></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
